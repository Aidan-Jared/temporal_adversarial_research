[project]
name = "mammoth"
version = "0.2.2"
readme = "README.md"
description = "The Mammoth framework for Continual Learning research."
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "The Mammoth Team" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: GPU :: NVIDIA CUDA"
]
keywords = [
    "continual-learning",
    "deep-learning",
    "pytorch",
]
dependencies = [
    "accelerate>=1.6.0",
    "altair>=6.1.0",
    "bitsandbytes>=0.45.4",
    "clip",
    "datasets>=4.5.0",
    "debugpy>=1.8.20",
    "dotenv>=0.9.9",
    "ftfy>=6.3.1",
    "googledrivedownloader==0.4",
    "gpustat>=1.1.1",
    "kornia>=0.7.0",
    "matplotlib>=3.10.8",
    "numpy>=2.2.4",
    "onedrivedownloader>=1.1.3",
    "open-clip-torch>=2.32.0",
    "opencv-python>=4.13.0.92",
    "pandas>=2.2.3",
    "pillow>=11.1.0",
    "polars>=1.42.1",
    "pyyaml>=6.0.2",
    "quadprog>=0.1.13",
    "regex>=2024.11.6",
    "scikit-image>=0.25.2",
    "scipy>=1.15.3",
    "sentencepiece>=0.2.0",
    "statsmodels>=0.14.6",
    "timm==0.9.8",
    "torchmetrics>=1.9.0",
    "tqdm>=4.67.1",
    "vegafusion>=2.0.3",
    "vl-convert-python>=1.9.0.post1",
    "wand>=0.7.0",
    "wandb>=0.20.1",
]

[project.urls]
Repository = "https://github.com/aimagelab/mammoth"
Documentation = "https://aimagelab.github.io/mammoth/"

[project.optional-dependencies]
extra = [
    "accelerate>=1.6.0",
    "bitsandbytes>=0.45.4",
    "clip",
    "decorator>=5.2.1",
    "googledrivedownloader==0.4",
    "kmeans-pytorch>=0.3",
    "onedrivedownloader==1.1.3",
    "pandas>=2.2.3",
    "qpsolvers",
    "scikit-learn>=1.6.1",
    "setproctitle==1.3.2",
    "timm==0.9.8",
    "transformers>=4.50.3",
    "wandb>=0.19.9",
    "xitorch>=0.5.1",
    "dotenv",
    "gdown",
    "matplotlib",
]

[tool.uv]
managed = true
exclude-newer = "30 days"
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
    "sys_platform == 'darwin'"
]

[tool.uv.sources]
clip = { git = "https://github.com/openai/CLIP.git" }
# torch = { editable = true, path = "./" }
# torchvision = { editable = true, path = "./" }
# opencv-python = { editable = true, path = "./" }

[tool.uv.workspace]
members = ["docs"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "mypy>=1.16.0",
    "pandas-stubs>=2.2.3.250527",
    "pytest>=8.3.5",
    "scipy-stubs>=1.15.3.0",
    "types-pyyaml>=6.0.12.20250516",
    "types-six>=1.17.0.20250515",
    "types-tqdm>=4.67.0.20250516",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra"
testpaths = "tests"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::RuntimeWarning",
    "ignore::FutureWarning",
    "ignore::Warning",
    "ignore::SyntaxWarning",
]

[tool.ruff.lint]
ignore = [
    "E402"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mammoth"]
py-modules = []
include-package-data = true

[tool.setuptools.package-dir]
mammoth = "."
